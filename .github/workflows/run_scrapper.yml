name: Run Pasco Real Estate Tracker

on:
  workflow_dispatch: # Allows you to run the script manually anytime with a button click
  # schedule:
  #   - cron: '0 4 * * *' # Executes automatically every single day at 4:00 AM UTC (Midnight EDT)

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute app.py Ingestion
      env:
        # Securely links your environment configurations into the cloud workspace
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        GBQ_DATASET_ID: ${{ secrets.GBQ_DATASET_ID }}
      run: python app.py
 
    - name: Sync Master File to Google Drive Native Setup
      run: |
        # 1. Download and install official rclone utility natively using the correct shell path
        sudo curl https://rclone.org | sudo bash
        
        # 2. Extract your secure secret JSON config file token onto the runner machine workspace
        mkdir -p ~/.config/rclone
        echo '${{ secrets.RCLONE_CONFIG_JSON }}' > ~/.config/rclone/rclone.conf
        
        # 3. Stream and overwrite your clean analytical database straight to your Google Drive root folder
        rclone copyto master_pasco_rental_trends.csv gdrive:master_pasco_rental_trends.csv

    - name: Commit and Push Daily CSV to Repository
      run: |
        # Configure a standard automated GitHub Bot profile to sign the commit
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Defensive Check: Ensure a CSV was actually generated before running Git commands
        if ls pasco_rental_tracker_*.csv 1>/dev/null 2>&1; then
          echo "Found generated real estate data files. Proceeding with repository commit."
          
          # Clean, unified staging command targeting both the daily files and the master trends file
          git add pasco_rental_tracker_*.csv master_pasco_rental_trends.csv
          
          # Save changes if new data exists, or exit cleanly if nothing changed
          git commit -m "Automated real estate data pull: $(date +'%Y-%m-%d')" || exit 0
          git push
        else
          echo "WARNING: No daily CSV file found to save. Skipping repository push step entirely."
          exit 0
        fi
